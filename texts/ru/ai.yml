# ИИ-ответы клиентам (AI_ENABLED=true)

# --- Клиенту ---

btn_call_human: 🙋 Позвать человека

client_escalated: Передал ваш вопрос специалисту поддержки — он ответит здесь же. Обычно это недолго.

client_already_escalated: Специалист уже в курсе и скоро ответит.

client_ticket_closed: Это обращение уже закрыто. Напишите сообщение, чтобы открыть новое.

# --- В теме тикета ---

topic_ai_reply_html: |
  🤖 <b>{name}</b> ответил клиенту:

  {text}

topic_draft_html: |
  🤖 <b>Черновик ответа</b> — отправить клиенту?

  {text}

btn_draft_send: ✅ Отправить
btn_draft_reject: ❌ Не отправлять

draft_sent_html: |
  ✅ <b>Отправлено клиенту</b> · {admin}

  {text}

draft_rejected_html: |
  ❌ <b>Не отправлено</b> · {admin}

  {text}

draft_stale_html: |
  ⏭ <b>Черновик устарел</b> — разговор ушёл дальше.

  {text}

draft_done: Черновик уже обработан
draft_ticket_closed: Тикет уже закрыт
draft_send_failed: Не удалось доставить клиенту — попробуйте ещё раз
draft_sent_toast: Отправлено клиенту
draft_rejected_toast: Не отправлено
draft_admin_only: Только для администраторов

topic_escalated_ai_html: |
  🙋 <b>Нужен человек</b> — ИИ передал тикет
  Причина: {reason}
  Суть: {summary}

  ИИ в этом тикете больше не отвечает. Вернуть: /ai on

topic_escalated_client_html: |
  🙋 <b>Клиент зовёт человека</b>

  ИИ в этом тикете больше не отвечает. Вернуть: /ai on

topic_escalated_limit_html: |
  🙋 <b>Нужен человек</b> — ИИ ответил уже {n} раз в этом тикете, дальше пусть отвечает сотрудник.

  Вернуть ИИ: /ai on

topic_error_html: |
  ⚠️ ИИ не смог ответить: {error}
  Ответьте клиенту вручную.

topic_rate_limited_html: ⚠️ ИИ не ответил — исчерпан лимит запросов к модели. Ответьте клиенту вручную.

topic_delivery_failed_html: ⚠️ Ответ ИИ не доставлен клиенту — возможно, он заблокировал бота.

# --- Команда /ai в теме ---

cmd_admin_only: 🔒 Команда /ai доступна только администраторам
cmd_disabled: 🤖 ИИ выключен в настройках бота (AI_ENABLED).
cmd_on: 🤖 ИИ снова отвечает в этом тикете
cmd_off: 🤖 ИИ больше не отвечает в этом тикете
cmd_status_on: "🤖 ИИ отвечает в этом тикете. Выключить: /ai off"
cmd_status_off: "🤖 ИИ в этом тикете молчит. Включить: /ai on"
