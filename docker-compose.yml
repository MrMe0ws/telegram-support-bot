services:
  support-bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/data
      # База знаний ИИ: .md-файлы правятся на сервере, бот подхватывает без перезапуска
      - ./knowledge:/app/knowledge:ro
    # networks:
    #   - remnawave-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

